<!doctype html>
<html lang="es-AR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Panel · 22doce Deco Hogar</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#6B1525">
  <link rel="icon" href="img/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Nunito+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css?v=2">
  <link rel="stylesheet" href="css/admin.css?v=2">
</head>
<body class="admin">
  <!-- INGRESO -->
  <section class="login" id="login">
    <form class="login__card" id="loginForm">
      <img src="img/logo-22doce.png" alt="22doce Deco Hogar" width="110" height="110">
      <h1>Panel de tu tienda</h1>
      <p>Cargá productos, mirá tus pedidos y tus reseñas de Google.</p>
      <label class="field"><span>Usuario</span><input value="22doce" autocomplete="username"></label>
      <label class="field"><span>Contraseña</span><input type="password" value="demo1234" autocomplete="current-password"></label>
      <button class="btn btn--primary btn--block" type="submit">Entrar al panel</button>
      <p class="login__note">Demo: entrá con los datos que ya están cargados. Los cambios se guardan solo en este navegador.</p>
      <a class="login__back" href="index.html">← Volver a la tienda</a>
    </form>
  </section>

  <!-- PANEL -->
  <div class="app" id="app" hidden>
    <aside class="side">
      <div class="side__brand"><img src="img/logo-22doce.png" alt="" width="44" height="44"><div><b>22doce</b><small>Panel</small></div></div>
      <nav class="side__nav" id="sideNav" aria-label="Secciones del panel"></nav>
      <div class="side__foot">
        <a class="side__link" href="index.html" target="_blank" rel="noopener" id="viewSite"></a>
        <button class="side__link" id="logout"></button>
      </div>
    </aside>
    <main class="main">
      <header class="topbar">
        <div><p class="eyebrow" id="crumb">Panel</p><h1 id="title">Resumen</h1></div>
        <div class="topbar__actions" id="topActions"></div>
      </header>
      <div id="content"></div>
    </main>
  </div>

  <!-- FORMULARIO DE PRODUCTO -->
  <dialog class="modal modal--form" id="pModal" aria-labelledby="pTitle">
    <form id="pForm" method="dialog">
      <div class="pform__head"><h2 id="pTitle">Nuevo producto</h2><button type="button" class="icon-btn" id="pClose" aria-label="Cerrar"></button></div>
      <div class="pform">
        <div class="pform__img">
          <div class="drop" id="drop">
            <img id="pPreview" alt="" hidden>
            <div class="drop__empty" id="dropEmpty"><span id="dropIco"></span><b>Subí una foto</b><small>Tocá acá o arrastrá la imagen</small></div>
          </div>
          <input type="file" id="pFile" accept="image/*" hidden>
          <button type="button" class="btn btn--ghost btn--block btn--sm" id="pPick">Elegir foto</button>
        </div>
        <div class="pform__fields">
          <label class="field"><span>Nombre del producto</span><input id="pName" required maxlength="60" placeholder="Ej.: Vela de soja con tapa de madera"></label>
          <div class="row2">
            <label class="field"><span>Categoría</span><select id="pCat"></select></label>
            <label class="field"><span>Precio</span><div class="money-in"><b>$</b><input id="pPrice" type="number" inputmode="numeric" min="0" step="100" required placeholder="15000"></div></label>
          </div>
          <label class="field"><span>Descripción</span><textarea id="pDesc" rows="3" maxlength="300" placeholder="Medidas, materiales, aroma, colores…"></textarea></label>
          <div class="toggles">
            <label class="tgl"><input type="checkbox" id="pStock" checked><span></span>Hay stock</label>
            <label class="tgl"><input type="checkbox" id="pVis" checked><span></span>Se ve en la web</label>
            <label class="tgl"><input type="checkbox" id="pDest"><span></span>Destacado</label>
            <label class="tgl"><input type="checkbox" id="pNew"><span></span>Etiqueta "Nuevo"</label>
          </div>
        </div>
      </div>
      <div class="pform__foot">
        <button type="button" class="btn btn--ghost" id="pDelete" hidden>Eliminar</button>
        <span class="grow"></span>
        <button type="button" class="btn btn--ghost" id="pCancel">Cancelar</button>
        <button type="submit" class="btn btn--primary" id="pSave">Guardar producto</button>
      </div>
    </form>
  </dialog>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="js/data.js?v=2"></script>
  <script src="js/store.js?v=2"></script>
  <script src="js/admin.js?v=2"></script>
</body>
</html>
